<div class="card mt-4">
  <div class="card-header">
    <h3>Génération de Rapports</h3>
  </div>
  <div class="card-body">
    <div class="row mb-4">
      <div class="col-md-6">
        <label class="form-label">Filtrer par statut (optionnel)</label>
        <select class="form-select" [(ngModel)]="selectedStatus">
          <option value="">Tous les statuts</option>
          <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
        </select>
      </div>
    </div>

    <div class="d-flex gap-3">
      <button class="btn btn-danger btn-lg" (click)="export('pdf')">
        <i class="bi bi-file-pdf"></i> Exporter en PDF
      </button>
      <button class="btn btn-success btn-lg" (click)="export('excel')">
        <i class="bi bi-file-excel"></i> Exporter en Excel
      </button>
    </div>
  </div>
</div>
