<div class="card mt-4">
  <div class="card-header">
    <h3>{{ isEditMode ? 'Modifier la requête' : 'Nouvelle requête' }}</h3>
  </div>
  <div class="card-body">
    <form (ngSubmit)="onSubmit()" #requestForm="ngForm">
      
      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Type de requête *</label>
          <select class="form-select" [(ngModel)]="request.request_type" name="request_type" required>
            <option *ngFor="let type of types" [value]="type">{{ type }}</option>
          </select>
        </div>
        
        <div class="col-md-4 mb-3">
          <label class="form-label">Priorité *</label>
          <select class="form-select" [(ngModel)]="request.priority" name="priority" required>
            <option *ngFor="let p of priorities" [value]="p">{{ p }}</option>
          </select>
        </div>

        <div class="col-md-4 mb-3">
          <label class="form-label">Agent Assigné</label>
          <input type="text" class="form-control" [(ngModel)]="request.assigned_agent" name="assigned_agent" placeholder="Nom de l'agent (optionnel)">
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Demandeur *</label>
          <input type="text" class="form-control" [(ngModel)]="request.requester_name" name="requester_name" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Service *</label>
          <input type="text" class="form-control" [(ngModel)]="request.requester_service" name="requester_service" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Contact *</label>
          <input type="text" class="form-control" [(ngModel)]="request.requester_contact" name="requester_contact" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description détaillée *</label>
        <textarea class="form-control" rows="5" [(ngModel)]="request.description" name="description" required></textarea>
      </div>

      <div class="row" *ngIf="isEditMode">
        <div class="col-md-6 mb-3">
          <label class="form-label">Statut</label>
          <select class="form-select" [(ngModel)]="request.status" name="status">
            <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
          </select>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Agent Assigné</label>
          <input type="text" class="form-control" [(ngModel)]="request.assigned_agent" name="assigned_agent">
        </div>
        <div class="col-md-12 mb-3">
            <label class="form-label">Commentaires Internes</label>
            <textarea class="form-control" rows="3" [(ngModel)]="request.internal_comments" name="internal_comments"></textarea>
        </div>
      </div>

      <div class="d-flex justify-content-between">
        <a routerLink="/" class="btn btn-secondary">Annuler</a>
        <button type="submit" class="btn btn-primary" [disabled]="!requestForm.form.valid">Enregistrer</button>
      </div>

    </form>
  </div>
</div>
