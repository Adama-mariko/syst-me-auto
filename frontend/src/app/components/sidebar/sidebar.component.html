<div class="d-flex flex-column flex-shrink-0 p-3 text-white bg-dark"
  style="width: 280px; height: 100vh; position: fixed; top: 0; left: 0; overflow-y: auto;">
  <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
    <span class="fs-4">Système Auto</span>
  </a>
  <hr>
  <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-link text-white"

        <i class="bi bi-speedometer2 me-2"></i>

    <li>
      <a routerLink="/requests/new" routerLinkActive="active" class="nav-link text-white">

      </a>

      <strong>Admin</strong>

    <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
      <li><a class="dropdown-item" href="#">Paramètres</a></li>
